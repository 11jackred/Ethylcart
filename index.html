
<!DOCTYPE html>
<html>
<head>
    <title>EthylCart</title>
    <link rel="stylesheet" href="styles/mainPage.css">
</head>

<body>

    <div class="h-line js-h-line">EthylCart</div>

    <div id="connectionPage">
        <button class="js-connectCart">Connect Cart</button>
        <p id="connectionStatus">Cart not connected</p>
    </div>


    <p id="barcodeStatus">Waiting for barcode...</p>
 

    <!-- Cart page stays inside this iframe.
         The main page keeps the Bluetooth connection alive. -->
    <iframe
        id="cartFrame"
        src="item.html"
        style="display: none; width: 100%; height: 85vh; border: none;">
    </iframe>

    <script type="module" src="scripts/mainPage.js"></script>
<script>
    // Listen for barcode messages from mainPage.js.
    window.addEventListener("message", (event) => {

        if (event.data.type === "BARCODE_RECEIVED") {

            document.querySelector("#barcodeStatus").textContent =
                "Barcode received: " + event.data.barcode;

        }


        if (event.data.type === "PRODUCT_FOUND") {
    const product = event.data.product;

    document.querySelector("#barcodeStatus").textContent =
        "Product: " + product.name +
        " | Price: " + product.price;
}

if (event.data.type === "PRODUCT_ERROR") {
    document.querySelector("#barcodeStatus").textContent =
        event.data.message;
}

    });
</script>
</body>
</html>
