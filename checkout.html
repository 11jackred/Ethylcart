
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EthylCart | Checkout</title>

    <link rel="stylesheet" href="styles/checkout.css">
</head>

<body>

    <main class="checkout-container">

        <h1>Checkout</h1>

        <section class="checkout-summary">

            <h2>Order Summary</h2>

            <p id="checkoutTotalItems">Total items: 0</p>

            <h2 id="checkoutTotalPrice">Total: ₹0.00</h2>

        </section>

        <section class="payment-section">

            <h2>Payment Method</h2>

            <label class="payment-option">
                <input
                    type="radio"
                    name="paymentMethod"
                    value="offline"
                    checked
                >

                <span>
                    <strong>Pay Offline</strong>
                    <small>Pay at the store checkout counter.</small>
                </span>
            </label>

            <!-- Online payment options can be added here later. -->

        </section>

        <div class="checkout-actions">

            <button
                id="backToCart"
                class="checkout-button"
                type="button"
                onclick="window.location.href='item.html'">
                Back to Cart
            </button>

            <button
                id="confirmOrder"
                class="checkout-button"
                type="button">
                Place Order
            </button>

        </div>

    </main>

    <script src="scripts/checkout.js"></script>

</body>

</html>
