<!DOCTYPE html>
<html>
<head>
    <title>EthylCart | Checkout</title>

    <link rel="stylesheet" href="styles/checkout.css">
</head>

<body>

    <h1>Checkout</h1>

    <div class="checkout-summary">

        <h2>Order Summary</h2>

        <p id="checkoutTotalItems">Total items: 0</p>

        <h2 id="checkoutTotalPrice">Total: ₹0.00</h2>

    </div>

    <button
        id="backToCart"
        class="checkout-button"
        onclick="window.location.href='item.html'">
        Back to Cart
    </button>

    <button id="confirmOrder" class="checkout-button">
        PAY NOW
    </button>

    <script src="scripts/checkout.js"></script>

</body>
</html>
