<!DOCTYPE html>
<html>
  <head>  
   <title>EthylCart</title>
  
    <link rel="stylesheet" href="styles/productPage.css">

  </head>

  <body>
 
<div class="item-list-container"></div>

<div class="fixed-container">

    <div class="cart-summary">
        <div id="totalItems">Total items: 0</div>
        <div id="totalPrice">Total price: ₹0.00</div>
    </div>

    <button class="checkout-button js-checkout-button">
    Checkout
</button>
<!-- Checkout confirmation popup -->
<div class="checkout-overlay" id="checkoutPopup">

    <div class="checkout-popup">

        <h2>Confirm Your Order</h2>

        <p>Do you want to proceed to checkout?</p>

        <div class="popup-buttons">

            <button id="backToCart">
                Back to Cart
            </button>

            <button id="confirmCheckout">
                Confirm Order
            </button>

        </div>

    </div>

</div>
</div>
 
 
    <script type="module" src="scripts/productPage.js"></script>


</body>

</html>
