
<!DOCTYPE html>
<html>
<head>
    <title>EthylCart | Admin</title>
    <!-- Ask search engines not to index the admin page. -->
<meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="styles/admin.css">
</head>

<body>

    <h1>EthylCart Admin Dashboard</h1>

    <!-- Admin login -->
    <form id="adminLogin">

        <h2>Admin Login</h2>

        <input
            type="password"
            id="adminPassword"
            placeholder="Enter admin password"
            required
        >

        <button type="submit">Login</button>

        <p id="loginMessage"></p>

    </form>

    <!-- Dashboard -->
    <div id="dashboard" hidden>

        <div class="dashboard-summary">

            <div class="summary-card">
                <h3>Total Orders</h3>
                <p id="totalOrders">0</p>
            </div>

            <div class="summary-card">
                <h3>Total Revenue</h3>
                <p id="totalRevenue">₹0.00</p>
            </div>

        </div>


<section id="paymentScannerSection">
    <h2>Payment Verification</h2>

    <button type="button" id="startScanner">
        Start QR Scanner
    </button>

    <div id="qrReader" style="width: 300px; max-width: 100%;"></div>

    <p id="scannerMessage">
        Scan a customer's checkout QR code.
    </p>

    <div id="scannedOrder" hidden>
        <h3>Checkout Details</h3>
        <p id="scannedOrderId"></p>
        <p id="scannedOrderTotal"></p>
        <p id="scannedPaymentStatus"></p>

        <button type="button" id="confirmPayment">
            Confirm Payment Received
        </button>
    </div>
</section>


<!-- Recent orders section with action buttons. -->
<div class="orders-header">

    <h2>Recent Orders</h2>

    <!-- Button to fetch the latest orders. -->
   <button id="refreshOrders">Refresh Orders</button>
<span id="refreshStatus" aria-live="polite"></span>

    <!-- Button to log out of the admin dashboard. -->
    <button id="logoutButton">Logout</button>

</div>

        <div id="ordersContainer">
            Loading orders...
        </div>

    </div>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="scripts/admin.js"></script>

</body>
</html>
